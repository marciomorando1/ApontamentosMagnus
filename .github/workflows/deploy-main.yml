name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    env:
      APP_PORT: ${{ vars.APP_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          docker --version
          docker compose version

      - name: Create production environment file
        run: |
          cat > .env.production <<EOF
          APP_PORT=${APP_PORT:-8099}
          POSTGRES_DB=${POSTGRES_DB:-magnus_rotinas}
          POSTGRES_USER=${POSTGRES_USER:-magnus_rotinas}
          DB_PASSWORD=${DB_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
          EOF
          sed -i 's/^          //' .env.production

      - name: Build images
        run: docker compose --env-file .env.production -p magnus-rotinas-prod -f docker-compose.production.yml build --pull

      - name: Deploy
        run: |
          docker compose --env-file .env.production -p magnus-rotinas-prod -f docker-compose.production.yml down --remove-orphans
          docker compose --env-file .env.production -p magnus-rotinas-prod -f docker-compose.production.yml up -d --remove-orphans

      - name: Wait for startup
        run: sleep 20

      - name: Verify containers
        run: |
          docker ps --filter "name=magnus-rotinas-app-prod" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          docker logs magnus-rotinas-app-prod --tail 50

      - name: Cleanup
        run: docker image prune -f