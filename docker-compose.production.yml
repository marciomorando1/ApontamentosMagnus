services:
  postgres:
    image: postgres:16
    container_name: magnus-rotinas-db-prod
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-magnus_rotinas}"
      POSTGRES_USER: "${POSTGRES_USER:-magnus_rotinas}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-magnus_rotinas}"
    volumes:
      - magnus-rotinas-db-prod-data:/var/lib/postgresql/data
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: magnus-rotinas-app:prod
    container_name: magnus-rotinas-app-prod
    ports:
      - "${APP_PORT:-8099}:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:-change-this-django-secret-key}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8099,http://127.0.0.1:8099}"
      FORCE_SCRIPT_NAME: "${FORCE_SCRIPT_NAME:-}"
      STATIC_URL: "${STATIC_URL:-/static/}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-magnus_rotinas}:${DB_PASSWORD:-magnus_rotinas}@postgres:5432/${POSTGRES_DB:-magnus_rotinas}"
    depends_on:
      - postgres
    restart: always

volumes:
  magnus-rotinas-db-prod-data: